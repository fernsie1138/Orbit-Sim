<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WANDERER — Navigation Console</title>
<style>
  :root {
    --green: #33ff33;
    --green-dim: #1a7a1a;
    --green-bright: #a6ffa6;
    --bg: #000000;
    --amber: #ffb000;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", "Share Tech Mono", monospace;
    color: var(--green);
  }

  #bezel {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: #000;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #screen {
    position: relative;
    flex: 1;
    margin: 8px;
    border: 2px solid var(--green-dim);
    border-radius: 10px;
    box-shadow: 0 0 24px rgba(51,255,51,0.15) inset, 0 0 12px rgba(51,255,51,0.08);
    overflow: hidden;
  }

  canvas#map {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* ---------- HUD ---------- */
  .hud-corner {
    position: absolute;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.55;
    letter-spacing: 0.5px;
    text-shadow: 0 0 6px rgba(51,255,51,0.6);
    pointer-events: none;
  }
  #hud-top-left { top: 0; left: 0; }
  #hud-top-right { top: 0; right: 0; text-align: right; }
  #hud-bottom-left { bottom: 0; left: 0; }

  .stat-row { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .stat-label { width: 66px; display: inline-block; opacity: 0.85; }
  .bar {
    width: 90px; height: 8px;
    border: 1px solid var(--green-dim);
    position: relative;
    display: inline-block;
  }
  .bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .bar-fill.warn { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .bar-fill.crit { background: #ff3333; box-shadow: 0 0 6px #ff3333; }

  /* ---------- Bottom control bar ---------- */
  #controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #controls > * { pointer-events: auto; }

  .btn {
    font-family: inherit;
    background: rgba(0,20,0,0.7);
    border: 1px solid var(--green-dim);
    color: var(--green);
    padding: 10px 14px;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 6px;
    text-transform: uppercase;
    backdrop-filter: blur(2px);
  }
  .btn:active { background: rgba(51,255,51,0.25); }
  .btn.primary { border-color: var(--green); color: var(--green-bright); }
  .btn.small { padding: 8px 10px; font-size: 11px; }

  #control-panel {
    position: absolute;
    right: 14px; bottom: 70px;
    padding: 8px;
    border: 1px solid var(--green-dim);
    border-radius: 6px;
    background: rgba(0,10,0,0.55);
    pointer-events: auto;
  }
  #control-panel .panel-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--green-dim);
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  #flight-controls {
    display: grid;
    grid-template-columns: repeat(2, 56px);
    grid-auto-rows: 52px;
    gap: 6px;
  }
  #flight-controls .btn {
    width: 100%; height: 100%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1.2; text-align: center;
  }
  #flight-controls .btn.wide { grid-column: span 2; }
  #flight-controls .btn.active { background: rgba(51,255,51,0.35); color: var(--green-bright); }
  #flight-controls .btn.rotate { font-size: 20px; }
  #flight-controls .btn.navcomp { grid-column: span 2; border-color: var(--green); color: var(--green-bright); }

  #navcomp-readout {
    position: absolute;
    right: 14px;
    /* stacked below #control-panel; JS sets --panel-height so this sits
       flush underneath regardless of how tall the control panel is on a
       given screen size, rather than a hardcoded offset that could
       overlap or leave an odd gap. */
    bottom: calc(70px + var(--control-panel-height, 190px) + 8px);
    width: 168px;
    padding: 8px;
    border: 1px solid var(--green-dim);
    border-radius: 6px;
    background: rgba(0,10,0,0.55);
    pointer-events: none;
    font-size: 10px;
    line-height: 1.6;
  }
  #navcomp-readout .panel-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--green-dim);
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  #navcomp-readout-body { color: var(--green); white-space: pre-line; }
  #navcomp-readout-body .idle { color: var(--green-dim); }
  #navcomp-readout-body .label { color: var(--green-dim); }
  #navcomp-readout-body .value { color: var(--green-bright); }

  #left-controls {
    position: absolute;
    left: 14px; bottom: 70px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: auto;
  }
  #speed-controls {
    display: flex; flex-wrap: wrap; gap: 4px;
    width: 168px; /* two rows of roughly-equal buttons instead of five
                     cramped ones in a single row on a narrow screen */
  }
  #speed-controls .btn { flex: 1 1 30%; padding: 8px 4px; font-size: 11px; }
  #speed-controls .btn.active { background: rgba(51,255,51,0.35); color: var(--green-bright); }

  /* ---------- NavComp popup ---------- */
  #navcomp-overlay .panel { min-width: 260px; }
  #navcomp-body { display: flex; flex-direction: column; gap: 12px; }
  #navcomp-select {
    font-family: inherit;
    background: #001400;
    border: 1px solid var(--green-dim);
    color: var(--green);
    padding: 10px 8px;
    font-size: 13px;
    width: 100%;
  }
  #navcomp-select optgroup { color: var(--green-bright); font-style: normal; }
  #navcomp-select option { color: var(--green); background: #001400; }
  #navcomp-status {
    font-size: 11px;
    color: var(--green-dim);
    min-height: 14px;
    letter-spacing: 0.5px;
  }
  #navcomp-status.warn { color: var(--amber); }
  .navcomp-actions { display: flex; gap: 8px; }
  .navcomp-actions .btn { flex: 1; }
  #navcomp-progress {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--green-bright);
    display: none;
    text-align: center;
    padding: 6px 0;
    border-top: 1px solid var(--green-dim);
    margin-top: 4px;
  }
  #navcomp-progress.active { display: block; }

  /* ---------- Menus ---------- */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,10,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .overlay.visible { display: flex; }
  .panel {
    border: 1px solid var(--green);
    box-shadow: 0 0 20px rgba(51,255,51,0.3);
    padding: 24px 28px;
    min-width: 280px;
    max-width: 90vw;
    background: #001400;
  }
  .panel h2 {
    margin: 0 0 16px 0;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--green-bright);
    border-bottom: 1px solid var(--green-dim);
    padding-bottom: 8px;
  }
  .panel .row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .panel-close { margin-top: 14px; display: flex; justify-content: flex-end; }

  #menu-btn {
    position: absolute; top: 8px; right: 8px;
    pointer-events: auto;
  }

  .scanline-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.08) 2px
    );
    mix-blend-mode: multiply;
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.85; }
    94% { opacity: 1; }
  }

  #toast {
    position: absolute;
    top: 44px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    padding: 6px 14px;
    border: 1px solid var(--green-dim);
    background: rgba(0,20,0,0.85);
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.visible { opacity: 1; }
</style>
</head>
<body>
<div id="bezel">
  <div id="screen">
    <canvas id="map"></canvas>

    <div class="hud-corner" id="hud-top-left">
      <div id="hud-location">SYSTEM: —</div>
      <div id="hud-refbody">TRACKING: —</div>
      <div id="hud-speed">V: 0.00 km/s</div>
      <div id="hud-orbit">AP: — PE: —</div>
    </div>

    <div class="hud-corner" id="hud-top-right">
      <div id="hud-clock">T+ 00:00:00</div>
      <div id="hud-warp">RUNNING</div>
    </div>

    <div class="hud-corner" id="hud-bottom-left">
      <div class="stat-row"><span class="stat-label">FUEL</span><div class="bar"><div class="bar-fill" id="bar-fuel"></div></div></div>
      <div class="stat-row"><span class="stat-label">OXYGEN</span><div class="bar"><div class="bar-fill" id="bar-oxygen"></div></div></div>
      <div class="stat-row"><span class="stat-label">SUPPLY</span><div class="bar"><div class="bar-fill" id="bar-supplies"></div></div></div>
      <div class="stat-row"><span class="stat-label">HULL</span><div class="bar"><div class="bar-fill" id="bar-hull"></div></div></div>
    </div>

    <button class="btn small" id="menu-btn">≡ MENU</button>

    <div id="left-controls">
      <button class="btn small" id="btn-pause">⏸ PAUSE</button>
      <button class="btn small" id="btn-follow-ship">◎ FOLLOW: ON</button>
      <div id="speed-controls">
        <button class="btn small" data-speed="0.1">0.1x</button>
        <button class="btn small" data-speed="1">1x</button>
        <button class="btn small" data-speed="5">5x</button>
        <button class="btn small" data-speed="10">10x</button>
        <button class="btn small" data-speed="100">100x</button>
      </div>
    </div>

    <div id="control-panel">
      <div class="panel-label">CONTROL PANEL</div>
      <div id="flight-controls">
        <button class="btn rotate" id="btn-rotate-left" title="Rotate Left">↺</button>
        <button class="btn rotate" id="btn-rotate-right" title="Rotate Right">↻</button>
        <button class="btn wide" id="btn-burn" title="Burn">▲ BURN</button>
        <button class="btn" id="btn-align-prograde" title="Align Prograde">PRO<br>GRADE</button>
        <button class="btn" id="btn-align-retrograde" title="Align Retrograde">RETRO<br>GRADE</button>
        <button class="btn navcomp" id="btn-navcomp" title="Navigation Computer">☉ NAVCOMP</button>
      </div>
    </div>

    <div id="navcomp-readout">
      <div class="panel-label">NAVCOMP STATUS</div>
      <div id="navcomp-readout-body"><span class="idle">STANDBY</span></div>
    </div>

    <div id="toast"></div>

    <!-- NavComp popup -->
    <div class="overlay" id="navcomp-overlay">
      <div class="panel">
        <h2>NAVIGATION COMPUTER</h2>
        <div id="navcomp-body">
          <select id="navcomp-select"></select>
          <div id="navcomp-status"></div>
          <div class="navcomp-actions">
            <button class="btn primary" id="btn-navcomp-engage">ENGAGE</button>
            <button class="btn" id="btn-navcomp-cancel">CANCEL</button>
          </div>
          <div id="navcomp-progress"></div>
        </div>
        <div class="panel-close"><button class="btn" id="btn-close-navcomp">CLOSE</button></div>
      </div>
    </div>

    <!-- Main menu overlay -->
    <div class="overlay" id="menu-overlay">
      <div class="panel">
        <h2>WANDERER CONSOLE</h2>
        <div class="row">
          <button class="btn primary" id="btn-save">SAVE GAME</button>
          <button class="btn" id="btn-load">LOAD GAME</button>
          <button class="btn" id="btn-export">EXPORT SAVE FILE</button>
          <button class="btn" id="btn-import">IMPORT SAVE FILE</button>
          <button class="btn" id="btn-newgame">NEW GAME</button>
          <button class="btn" id="btn-reset">RESET SIMULATION</button>
          <input type="file" id="file-import" accept="application/json" style="display:none">
        </div>
        <div class="panel-close"><button class="btn" id="btn-close-menu">CLOSE</button></div>
      </div>
    </div>

    <div class="scanline-overlay"></div>
  </div>
</div>

<script src="state.js"></script>
<script src="physics.js"></script>
<script src="save.js"></script>
<script src="starmap.js"></script>
<script src="input.js"></script>
<script src="navcomp.js"></script>
<script>
/* =========================================================================
   MAIN.JS (inline) — Boots the game: loads or creates state, wires up
   the render/physics loop, HUD updates, and menu buttons.
   ========================================================================= */

let gameState = SaveSystem.load() || createNewGameState();

const canvas = document.getElementById('map');
StarMap.init(canvas);

// Give the camera a sane default on first-ever boot (fresh state has
// camera.zoom = 1 which is way too zoomed in for a whole system).
if (gameState.camera.zoom === 1 && gameState.meta.savedAt === null) {
  gameState.camera.zoom = 0.06;
  gameState.camera.x = 0;
  gameState.camera.y = 0;
}

Input.init(canvas, gameState, () => {}); // camera mutates gameState directly

// ---- Flight controls: rotate + burn are HELD (pressed/released), not
// single taps, since the ship now has continuous attitude control. We
// track raw press state here and read it once per frame in the main
// loop, rather than mutating physics directly from the event handlers —
// keeps all physics changes flowing through Physics.step() in one place.
// Position the NavComp readout flush beneath the control panel by
// measuring its actual rendered height rather than a hardcoded offset —
// avoids a gap or overlap if the panel's size changes (e.g. different
// screen width wrapping the flight-controls grid differently).
function positionNavcompReadout() {
  const panel = document.getElementById('control-panel');
  document.documentElement.style.setProperty('--control-panel-height', panel.offsetHeight + 'px');
}
window.addEventListener('resize', positionNavcompReadout);
positionNavcompReadout();

const heldControls = { rotate: 0, thrust: false };

const btnRotateLeft = document.getElementById('btn-rotate-left');
const btnRotateRight = document.getElementById('btn-rotate-right');
const btnBurn = document.getElementById('btn-burn');

function bindHold(el, onStart, onEnd) {
  // touch-action: manipulation tells the browser this element handles its
  // own press/hold behavior and it shouldn't intercept the gesture for
  // its own purposes (long-press callouts, double-tap-to-zoom detection,
  // etc). Without this, iOS Safari can swallow the touch sequence
  // mid-gesture on a sustained press and never deliver a clean pointerup
  // to our own listener — which is exactly the "Burn gets stuck on"
  // symptom: the button's onStart fires, but its own onEnd never does,
  // because Safari decided the hold was the start of a different
  // gesture and stopped delivering pointer events for it.
  el.style.touchAction = 'manipulation';
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); onStart(); });
  el.addEventListener('pointerup', onEnd);
  el.addEventListener('pointercancel', onEnd);
  el.addEventListener('pointerleave', onEnd);
}

// Belt-and-suspenders: if a held control's release event is ever missed
// for any reason (a stray browser gesture swallowing it, a finger
// lifting off-screen, etc), a global pointerup/pointercancel anywhere in
// the document forces every held control off. This can never incorrectly
// cancel a burn that's still actually being held, since a genuine held
// touch keeps firing pointerdown/no pointerup on THAT element — it only
// ever catches the case where a release happened somewhere and our
// specific listener missed it.
function forceReleaseHeldControls() {
  if (heldControls.thrust) { heldControls.thrust = false; btnBurn.classList.remove('active'); }
  if (heldControls.rotate !== 0) {
    heldControls.rotate = 0;
    btnRotateLeft.classList.remove('active');
    btnRotateRight.classList.remove('active');
  }
}
document.addEventListener('pointerup', forceReleaseHeldControls);
document.addEventListener('pointercancel', forceReleaseHeldControls);

bindHold(btnRotateLeft,
  () => { heldControls.rotate = -1; btnRotateLeft.classList.add('active'); },
  () => { if (heldControls.rotate === -1) heldControls.rotate = 0; btnRotateLeft.classList.remove('active'); });

bindHold(btnRotateRight,
  () => { heldControls.rotate = 1; btnRotateRight.classList.add('active'); },
  () => { if (heldControls.rotate === 1) heldControls.rotate = 0; btnRotateRight.classList.remove('active'); });

bindHold(btnBurn,
  () => { heldControls.thrust = true; btnBurn.classList.add('active'); },
  () => { heldControls.thrust = false; btnBurn.classList.remove('active'); });

// ---- Align prograde/retrograde: these SET a target the ship steers
// toward every frame (see Physics.stepAttitude) rather than an instant
// snap, so the rotation is visible and any manual rotate input cancels
// it cleanly. Tapping the already-active one turns it off.
const btnAlignPro = document.getElementById('btn-align-prograde');
const btnAlignRetro = document.getElementById('btn-align-retrograde');

function setAlignTarget(target) {
  const ship = gameState.player.ship;
  ship.alignTarget = (ship.alignTarget === target) ? null : target;
  btnAlignPro.classList.toggle('active', ship.alignTarget === 'prograde');
  btnAlignRetro.classList.toggle('active', ship.alignTarget === 'retrograde');
}
btnAlignPro.addEventListener('click', () => setAlignTarget('prograde'));
btnAlignRetro.addEventListener('click', () => setAlignTarget('retrograde'));

// ---- NavComp: pick a body, engage an automated transfer, and let the
// autopilot fly it. While gameState.player.ship.autopilot is set, the
// main loop (below) drives Autopilot.driveFrame instead of the normal
// manual Physics.step(heldControls) path, and manual flight controls are
// disabled so the player can't fight the autopilot mid-burn.
const navcompOverlay = document.getElementById('navcomp-overlay');
const navcompSelect = document.getElementById('navcomp-select');
const navcompStatus = document.getElementById('navcomp-status');
const navcompProgress = document.getElementById('navcomp-progress');
const btnNavcomp = document.getElementById('btn-navcomp');
const btnNavcompEngage = document.getElementById('btn-navcomp-engage');
const btnNavcompCancel = document.getElementById('btn-navcomp-cancel');

// Friendly labels for the autopilot's internal stage names, shown while
// a transfer is in progress so the player has some sense of what's
// happening during a long unattended burn/coast sequence.
const NAVCOMP_STAGE_LABELS = {
  ESCAPE_BURN: 'ESCAPING CURRENT ORBIT',
  RAISE_ORBIT: 'ADJUSTING ORBIT',
  COAST_TO_RADIUS: 'COASTING TO TARGET RANGE',
  MATCH_ANGLE: 'PHASING FOR RENDEZVOUS',
  CAPTURE_BURN: 'CAPTURE BURN',
};

// Friendly sub-labels for MATCH_ANGLE's internal sub-phases, shown as
// extra context since "PHASING FOR RENDEZVOUS" alone can look identical
// for a long stretch while the ship cycles through several small burns
// and waits under the hood.
const NAVCOMP_MATCH_ANGLE_SUBPHASE_LABELS = {
  CHECK_GAP: 'CHECKING ALIGNMENT',
  PHASE_BURN: 'BURNING TO PHASING ORBIT',
  PHASE_COAST: 'COASTING TO PHASING ORBIT',
  PHASE_CIRCULARIZE: 'CIRCULARIZING',
  WAITING: 'WAITING FOR ALIGNMENT',
  RETURN_BURN: 'RETURNING TO TARGET RANGE',
  RETURN_COAST: 'RETURNING TO TARGET RANGE',
  RETURN_CIRCULARIZE: 'CIRCULARIZING',
};

function populateNavcompOptions() {
  const system = getCurrentSystem(gameState);
  const bodies = NavComp.listNavigableBodies(system, gameState.player.ship);
  // Only planets and star-orbiting stations/asteroids are valid NavComp
  // targets per current scope (see Autopilot.createPlan) — moons are
  // reached by first achieving orbit around their host planet, so they
  // are intentionally left off this list rather than offered and then
  // rejected after the player picks one.
  const validKinds = new Set([BodyKind.PLANET, BodyKind.STATION, BodyKind.ASTEROID]);
  const groups = { PLANET: [], STATION: [], ASTEROID: [] };
  bodies.forEach(b => {
    if (!validKinds.has(b.kind)) return;
    if (b.isCurrent) return; // can't navigate to where the ship already is
    // Stations/asteroids orbiting a PLANET (not the star) are also out
    // of scope for the same reason moons are — only direct-solar-orbit
    // targets are offered here.
    if (b.kind !== BodyKind.PLANET && b.parentName && b.parentName.toLowerCase() !== 'sol'
        && !system.bodies.find(sb => sb.id === b.parentId && sb.kind === BodyKind.STAR)) {
      return;
    }
    (groups[b.kind] || groups.PLANET).push(b);
  });

  navcompSelect.innerHTML = '';
  const groupLabels = { PLANET: 'Planets', STATION: 'Stations', ASTEROID: 'Asteroids' };
  Object.keys(groups).forEach(kind => {
    if (groups[kind].length === 0) return;
    const optgroup = document.createElement('optgroup');
    optgroup.label = groupLabels[kind] || kind;
    groups[kind].forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.name;
      optgroup.appendChild(opt);
    });
    navcompSelect.appendChild(optgroup);
  });

  if (navcompSelect.options.length === 0) {
    navcompStatus.textContent = 'NO VALID DESTINATIONS';
    navcompStatus.classList.add('warn');
    btnNavcompEngage.disabled = true;
  } else {
    navcompStatus.textContent = '';
    navcompStatus.classList.remove('warn');
    btnNavcompEngage.disabled = false;
  }
}

function openNavcomp() {
  const ship = gameState.player.ship;
  if (ship.autopilot) {
    // Reopening while already engaged shows progress instead of the
    // picker — and critically, does NOT rebuild/reset the dropdown,
    // since doing so unconditionally here was the actual bug behind
    // NavComp appearing to "forget" the chosen target and show Aldrin
    // instead: populateNavcompOptions() rebuilds the <select> from
    // scratch every time, and a freshly rebuilt dropdown defaults to
    // whichever option happens to be first in the list — completely
    // disconnected from what the active plan is actually flying to.
    // The persistent status readout (see updateNavcompReadout) is now
    // the source of truth for "what is NavComp doing," driven directly
    // from ship.autopilot.targetBodyId rather than the dropdown's
    // incidental selected value.
    navcompProgress.classList.add('active');
    navcompSelect.disabled = true;
    btnNavcompEngage.style.display = 'none';
  } else {
    populateNavcompOptions();
    navcompProgress.classList.remove('active');
    navcompSelect.disabled = false;
    btnNavcompEngage.style.display = '';
  }
  navcompOverlay.classList.add('visible');
  updateNavcompProgress(); // refresh immediately, don't wait for next frame
}
btnNavcomp.addEventListener('click', openNavcomp);
document.getElementById('btn-close-navcomp').addEventListener('click', () => {
  navcompOverlay.classList.remove('visible');
});

btnNavcompEngage.addEventListener('click', () => {
  const targetId = navcompSelect.value;
  if (!targetId) return;
  const system = getCurrentSystem(gameState);
  const plan = Autopilot.createPlan(system, gameState.player.ship, targetId);
  if (!plan) {
    navcompStatus.textContent = 'NO VALID TRAJECTORY';
    navcompStatus.classList.add('warn');
    return;
  }
  // Engaging hands full control to the autopilot: clear any manual
  // align target and held-button state so nothing fights the computer,
  // and disable the flight-control buttons for the duration.
  gameState.player.ship.alignTarget = null;
  heldControls.rotate = 0;
  heldControls.thrust = false;
  btnRotateLeft.classList.remove('active');
  btnRotateRight.classList.remove('active');
  btnBurn.classList.remove('active');
  setFlightControlsEnabled(false);
  gameState.player.ship.autopilot = plan;
  navcompSelect.disabled = true;
  btnNavcompEngage.style.display = 'none';
  navcompProgress.classList.add('active');
  showToast('NAVCOMP ENGAGED');
  navcompOverlay.classList.remove('visible');
  updateNavcompProgress(); // refresh immediately, don't wait for next frame
});

btnNavcompCancel.addEventListener('click', () => {
  if (gameState.player.ship.autopilot) {
    gameState.player.ship.autopilot = null;
    gameState.player.ship.alignTarget = null;
    setFlightControlsEnabled(true);
    showToast('NAVCOMP DISENGAGED');
  }
  navcompOverlay.classList.remove('visible');
  updateNavcompProgress();
});

function setFlightControlsEnabled(enabled) {
  [btnRotateLeft, btnRotateRight, btnBurn, btnAlignPro, btnAlignRetro].forEach(btn => {
    btn.disabled = !enabled;
    btn.style.opacity = enabled ? '' : '0.35';
  });
}

// Always-visible NavComp status readout, shown under the control panel
// regardless of whether the popup is open — this is the authoritative
// "what is NavComp doing right now" display, driven directly from
// ship.autopilot itself (never from the dropdown's selected value, which
// is only meaningful while the player is actively choosing a NEW target
// and gets rebuilt/reset independently — see openNavcomp's comment).
const navcompReadoutBody = document.getElementById('navcomp-readout-body');

function formatNavcompReadout(state) {
  const ship = state.player.ship;
  const plan = ship.autopilot;
  if (!plan) return '<span class="idle">STANDBY</span>';

  const system = getCurrentSystem(state);
  const targetBody = Physics.findBody(system, plan.targetBodyId);
  const targetName = targetBody ? targetBody.name.toUpperCase() : plan.targetBodyId.toUpperCase();
  const stageLabel = NAVCOMP_STAGE_LABELS[plan.stage] || plan.stage;

  const lines = [];
  lines.push(`<span class="label">TARGET</span> <span class="value">${targetName}</span>`);
  lines.push(`<span class="label">STAGE</span> <span class="value">${stageLabel}</span>`);

  // A little extra context per stage, since a stage name alone can look
  // identical for a long stretch — showing burn progress, range, or
  // eccentricity makes it clear NavComp is still actively working.
  if ((plan.stage === 'RAISE_ORBIT') && plan.hohmann) {
    const pct = Math.min(100, (plan.dvApplied / Math.abs(plan.hohmann.dv1)) * 100);
    lines.push(`<span class="label">BURN</span> <span class="value">${pct.toFixed(0)}%</span>`);
  } else if (plan.stage === 'COAST_TO_RADIUS' && plan.hohmann) {
    const positions = Physics.allWorldPositions(system);
    const lca = Physics.findBody(system, plan.lcaId);
    const lcaPos = positions.get(lca.id);
    const dist = Math.hypot(ship.x - lcaPos.x, ship.y - lcaPos.y);
    lines.push(`<span class="label">RANGE</span> <span class="value">${dist.toFixed(0)} / ${plan.hohmann.r2.toFixed(0)}</span>`);
  } else if (plan.stage === 'MATCH_ANGLE') {
    const subLabel = NAVCOMP_MATCH_ANGLE_SUBPHASE_LABELS[plan.matchAnglePhase] || plan.matchAnglePhase || '—';
    lines.push(`<span class="label">STEP</span> <span class="value">${subLabel}</span>`);
  } else if (plan.stage === 'CAPTURE_BURN') {
    const els = Physics.orbitalElements(system, ship);
    lines.push(`<span class="label">ECC.</span> <span class="value">${els ? els.e.toFixed(3) : '—'}</span>`);
  }

  return lines.join('\n');
}

function updateNavcompProgress() {
  const ship = gameState.player.ship;
  if (ship.autopilot && navcompProgress.classList.contains('active')) {
    const label = NAVCOMP_STAGE_LABELS[ship.autopilot.stage] || ship.autopilot.stage;
    navcompProgress.textContent = label;
  }
  navcompReadoutBody.innerHTML = formatNavcompReadout(gameState);
}


// ---- Pause ----
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  gameState.time.paused = !gameState.time.paused;
  btnPause.textContent = gameState.time.paused ? '▶ RESUME' : '⏸ PAUSE';
});

// ---- Speed (0.1x/1x/5x/10x/100x) ----
// A capped range rather than the old wide warp scale: attitude flying
// (rotate/burn/align) needs to stay controllable. 0.1x gives fine
// control for a tricky final approach or docking-style maneuver; 100x
// is fast enough to skip through a long interplanetary coast.
const speedButtons = document.querySelectorAll('[data-speed]');
function setSpeedButtonsActive(scale) {
  speedButtons.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.speed) === scale));
}
speedButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    gameState.time.timeScale = Number(btn.dataset.speed);
    setSpeedButtonsActive(gameState.time.timeScale);
  });
});
setSpeedButtonsActive(gameState.time.timeScale);

// ---- Follow-ship camera toggle ----
const btnFollow = document.getElementById('btn-follow-ship');
btnFollow.addEventListener('click', () => {
  const on = !gameState.camera.followShip;
  Input.setFollowShip(on);
  btnFollow.textContent = on ? '◎ FOLLOW: ON' : '◎ FOLLOW: OFF';
});


// ---- Menu wiring ----
const menuOverlay = document.getElementById('menu-overlay');
document.getElementById('menu-btn').onclick = () => menuOverlay.classList.add('visible');
document.getElementById('btn-close-menu').onclick = () => menuOverlay.classList.remove('visible');

// Whenever gameState is replaced wholesale (load/new game/import), the
// control buttons need to resync their visual state to match — otherwise
// e.g. the pause button could still say "RESUME" after loading a save
// that wasn't paused, which would be a confusing, silently-wrong label.
function syncControlButtonsToState() {
  btnPause.textContent = gameState.time.paused ? '▶ RESUME' : '⏸ PAUSE';
  btnFollow.textContent = gameState.camera.followShip ? '◎ FOLLOW: ON' : '◎ FOLLOW: OFF';
  btnAlignPro.classList.toggle('active', gameState.player.ship.alignTarget === 'prograde');
  btnAlignRetro.classList.toggle('active', gameState.player.ship.alignTarget === 'retrograde');
  setSpeedButtonsActive(gameState.time.timeScale);
  heldControls.rotate = 0;
  heldControls.thrust = false;
  btnRotateLeft.classList.remove('active');
  btnRotateRight.classList.remove('active');
  btnBurn.classList.remove('active');
  // A load/new-game/reset can land mid-transfer (a saved autopilot plan)
  // or with none — sync the flight-control enable state and progress
  // display to match whatever came in, rather than assuming neither.
  setFlightControlsEnabled(!gameState.player.ship.autopilot);
  navcompProgress.classList.toggle('active', !!gameState.player.ship.autopilot);
  navcompOverlay.classList.remove('visible');
}

document.getElementById('btn-save').onclick = () => {
  const res = SaveSystem.save(gameState);
  showToast(res.ok ? 'GAME SAVED' : 'SAVE FAILED');
};
document.getElementById('btn-load').onclick = () => {
  const loaded = SaveSystem.load();
  if (loaded) {
    gameState = loaded;
    Input.init(canvas, gameState, () => {}); // re-bind to new state object
    syncControlButtonsToState();
    showToast('GAME LOADED');
    menuOverlay.classList.remove('visible');
  } else {
    showToast('NO SAVE FOUND');
  }
};
// Shared by both "New Game" and "Reset Simulation" — right now these are
// functionally identical (there's no persistent player progression yet
// to distinguish "start fresh" from "put the current run back at its
// starting point"), but kept as separate menu entries and a named
// function since that will likely change once trading/engineering/
// discovery add real progression a player wouldn't want reset.
function resetToStart(confirmMessage, toastMessage) {
  if (confirm(confirmMessage)) {
    gameState = createNewGameState();
    gameState.camera.zoom = 0.06;
    Input.init(canvas, gameState, () => {});
    syncControlButtonsToState();
    showToast(toastMessage);
    menuOverlay.classList.remove('visible');
  }
}
document.getElementById('btn-newgame').onclick = () => {
  resetToStart('Start a new game? Unsaved progress will be lost.', 'NEW GAME STARTED');
};
document.getElementById('btn-reset').onclick = () => {
  resetToStart('Reset the simulation back to its starting state? Unsaved progress will be lost.', 'SIMULATION RESET');
};
document.getElementById('btn-export').onclick = () => SaveSystem.exportToFile(gameState);
document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
document.getElementById('file-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  SaveSystem.importFromFile(file, (loaded, err) => {
    if (err) { showToast('IMPORT FAILED'); return; }
    gameState = loaded;
    Input.init(canvas, gameState, () => {});
    syncControlButtonsToState();
    showToast('SAVE IMPORTED');
    menuOverlay.classList.remove('visible');
  });
});

// ---- Toast ----
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), 1500);
}

// ---- HUD update ----
function fmtClock(simSeconds) {
  const s = Math.floor(simSeconds);
  const hh = Math.floor(s / 3600).toString().padStart(2, '0');
  const mm = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
  const ss = Math.floor(s % 60).toString().padStart(2, '0');
  return `T+ ${hh}:${mm}:${ss}`;
}

function setBar(id, pct) {
  const el = document.getElementById(id);
  el.style.width = `${Math.max(0, Math.min(100, pct))}%`;
  el.classList.remove('warn', 'crit');
  if (pct < 15) el.classList.add('crit');
  else if (pct < 40) el.classList.add('warn');
}

function updateHud() {
  const ship = gameState.player.ship;
  const system = getCurrentSystem(gameState);

  document.getElementById('hud-location').textContent = `SYSTEM: ${system.name.toUpperCase()}`;

  const near = Physics.nearestBody(system, ship);
  document.getElementById('hud-refbody').textContent = `TRACKING: ${near ? near.name.toUpperCase() : '—'}`;

  const speed = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
  document.getElementById('hud-speed').textContent = `V: ${speed.toFixed(2)} km/s`;

  const els = Physics.orbitalElements(system, ship);
  const orbitEl = document.getElementById('hud-orbit');
  if (els && els.closed) {
    orbitEl.textContent = `AP: ${els.rApo.toFixed(1)} PE: ${els.rPeri.toFixed(1)}`;
  } else {
    orbitEl.textContent = 'AP: ESCAPE PE: —';
  }

  document.getElementById('hud-clock').textContent = fmtClock(gameState.time.simSeconds);
  document.getElementById('hud-warp').textContent = gameState.time.paused ? 'PAUSED' : 'RUNNING';

  setBar('bar-fuel', (ship.fuel / ship.fuelMax) * 100);
  setBar('bar-oxygen', (ship.oxygen / ship.oxygenMax) * 100);
  setBar('bar-supplies', (ship.supplies / ship.suppliesMax) * 100);
  setBar('bar-hull', (ship.hull / ship.hullMax) * 100);
}

// ---- Main loop ----
let lastTime = performance.now();
function loop(now) {
  const realDt = Math.min(0.1, (now - lastTime) / 1000); // clamp for tab-switch stalls
  lastTime = now;

  const ship = gameState.player.ship;
  if (ship.autopilot) {
    const stillGoing = Autopilot.driveFrame(gameState, ship.autopilot, realDt);
    if (!stillGoing) {
      ship.autopilot = null;
      ship.alignTarget = null;
      setFlightControlsEnabled(true);
      navcompProgress.classList.remove('active');
      showToast('NAVCOMP: ARRIVED');
    }
  } else {
    Physics.step(gameState, realDt, heldControls);
  }
  updateNavcompProgress(); // every frame, regardless of autopilot state,
                            // so the readout correctly shows STANDBY when
                            // idle and updates live numbers while active.
  StarMap.draw(gameState);
  updateHud();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- Autosave on page hide (covers iPad Safari backgrounding/closing) ----
document.addEventListener('visibilitychange', () => {
  if (document.hidden) SaveSystem.save(gameState);
});
window.addEventListener('pagehide', () => SaveSystem.save(gameState));
</script>
