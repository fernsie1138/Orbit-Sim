<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WANDERER — Navigation Console</title>
<style>
  :root {
    --green: #33ff33;
    --green-dim: #1a7a1a;
    --green-bright: #a6ffa6;
    --bg: #000000;
    --amber: #ffb000;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", "Share Tech Mono", monospace;
    color: var(--green);
  }

  #bezel {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: #000;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #screen {
    position: relative;
    flex: 1;
    margin: 8px;
    border: 2px solid var(--green-dim);
    border-radius: 10px;
    box-shadow: 0 0 24px rgba(51,255,51,0.15) inset, 0 0 12px rgba(51,255,51,0.08);
    overflow: hidden;
  }

  canvas#map {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* ---------- HUD ---------- */
  .hud-corner {
    position: absolute;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.55;
    letter-spacing: 0.5px;
    text-shadow: 0 0 6px rgba(51,255,51,0.6);
    pointer-events: none;
  }
  #hud-top-left { top: 0; left: 0; }
  #hud-top-right { top: 0; right: 0; text-align: right; }

  .stat-row { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .stat-readout { font-size: 10px; color: var(--green-dim); min-width: 62px; }
  .stat-label { width: 66px; display: inline-block; opacity: 0.85; }
  .bar {
    width: 90px; height: 8px;
    border: 1px solid var(--green-dim);
    position: relative;
    display: inline-block;
  }
  .bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .bar-fill.warn { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .bar-fill.crit { background: #ff3333; box-shadow: 0 0 6px #ff3333; }

  .btn {
    font-family: inherit;
    background: rgba(0,20,0,0.7);
    border: 1px solid var(--green-dim);
    color: var(--green);
    padding: 10px 14px;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 6px;
    text-transform: uppercase;
    backdrop-filter: blur(2px);
  }
  .btn:active { background: rgba(51,255,51,0.25); }
  .btn.primary { border-color: var(--green); color: var(--green-bright); }
  .btn.small { padding: 8px 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.35; }
  .btn.landed { border-color: var(--amber); color: var(--amber); }

  #control-panel {
    position: absolute;
    right: 14px; bottom: 70px;
    padding: 8px;
    border: 1px solid var(--green-dim);
    border-radius: 6px;
    background: rgba(0,10,0,0.55);
    pointer-events: auto;
  }
  #control-panel .panel-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--green-dim);
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  #flight-controls {
    display: grid;
    grid-template-columns: repeat(2, 56px);
    grid-auto-rows: 52px;
    gap: 6px;
  }
  #flight-controls .btn {
    width: 100%; height: 100%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1.2; text-align: center;
  }
  #flight-controls .btn.wide { grid-column: span 2; }
  #flight-controls .btn.active { background: rgba(51,255,51,0.35); color: var(--green-bright); }
  #flight-controls .btn.rotate { font-size: 20px; }

  #left-controls {
    position: absolute;
    left: 14px; bottom: 70px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: auto;
  }
  #speed-controls {
    display: flex; flex-wrap: wrap; gap: 4px;
    width: 168px; /* two rows of roughly-equal buttons instead of five
                     cramped ones in a single row on a narrow screen */
  }
  #speed-controls .btn { flex: 1 1 30%; padding: 8px 4px; font-size: 11px; }
  #speed-controls .btn.active { background: rgba(51,255,51,0.35); color: var(--green-bright); }

  /* ---------- Menus ---------- */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,10,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .overlay.visible { display: flex; }
  .panel {
    border: 1px solid var(--green);
    box-shadow: 0 0 20px rgba(51,255,51,0.3);
    padding: 24px 28px;
    min-width: 280px;
    max-width: 90vw;
    background: #001400;
  }
  .panel h2 {
    margin: 0 0 16px 0;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--green-bright);
    border-bottom: 1px solid var(--green-dim);
    padding-bottom: 8px;
  }
  .panel .row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .panel-close { margin-top: 14px; display: flex; justify-content: flex-end; }

  /* ---------- Codex ---------- */
  .codex-panel {
    width: 520px;
    max-width: 92vw;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  #codex-body { overflow-y: auto; flex: 1; }
  .codex-group { margin-bottom: 14px; }
  .codex-group-title {
    font-size: 11px; letter-spacing: 2px; color: var(--green-dim);
    text-transform: uppercase; margin: 10px 0 4px;
  }
  .codex-entry-btn {
    display: block; width: 100%; text-align: left;
    background: none; border: none; color: var(--green);
    font-family: inherit; font-size: 13px; letter-spacing: 0.5px;
    padding: 8px 6px; cursor: pointer; border-bottom: 1px solid rgba(51,255,51,0.12);
  }
  .codex-entry-btn:active { background: rgba(51,255,51,0.12); }
  .codex-entry-btn.moon { padding-left: 22px; color: var(--green-dim); font-size: 12px; }
  .codex-detail h3 { color: var(--green-bright); margin: 0 0 2px; font-size: 16px; letter-spacing: 1px; }
  .codex-detail .codex-type { color: var(--amber); font-size: 11px; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
  .codex-field { margin-bottom: 10px; }
  .codex-field-label { font-size: 10px; letter-spacing: 1.5px; color: var(--green-dim); text-transform: uppercase; margin-bottom: 2px; }
  .codex-field-body { font-size: 13px; line-height: 1.5; }
  .codex-field-body ul { margin: 2px 0; padding-left: 18px; }
  .codex-field-body li { margin-bottom: 2px; }
  .codex-personality { margin-bottom: 6px; }
  .codex-personality .name { color: var(--green-bright); }
  .codex-personality .role { color: var(--green-dim); font-size: 11px; }

  /* World-info auto-popup — slides in on the RIGHT when the ship enters
     orbit around a planet or moon. Deliberately separate from the Codex
     overlay (not modal, doesn't block the rest of the screen) since it's
     meant to appear automatically mid-flight without stopping the player
     from doing anything else. */
  #world-info-panel {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 280px;
    max-width: 78vw;
    background: rgba(0,16,0,0.95);
    border-left: 1px solid var(--green);
    box-shadow: -8px 0 24px rgba(0,0,0,0.5);
    z-index: 15;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease-out;
    pointer-events: none;
  }
  #world-info-panel.visible { transform: translateX(0); pointer-events: auto; }
  #world-info-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 14px 10px; border-bottom: 1px solid var(--green-dim);
  }
  #world-info-header h3 { margin: 0; color: var(--green-bright); font-size: 14px; letter-spacing: 1px; }
  #btn-close-world-info {
    background: none; border: 1px solid var(--green-dim); color: var(--green);
    font-family: inherit; padding: 4px 9px; cursor: pointer; border-radius: 4px;
  }
  #world-info-body {
    padding: 12px 14px; overflow-y: auto; flex: 1;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }

  #menu-btn {
    /* Now laid out as the first item inside #hud-top-right (normal
       document flow, not its own absolutely-positioned element) so it
       can never again end up stacked directly on top of the clock/warp/
       build text underneath it — both used to anchor independently to
       the same top-right corner, which is exactly what caused them to
       visibly overlap. */
    margin-bottom: 6px;
    pointer-events: auto; /* this one button stays clickable even though
                              its parent .hud-corner otherwise disables
                              pointer events, so the dim HUD text never
                              blocks taps on the map underneath it */
  }

  .scanline-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.08) 2px
    );
    mix-blend-mode: multiply;
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.85; }
    94% { opacity: 1; }
  }

  #toast {
    position: absolute;
    /* Clear of BOTH top corners' HUD text, not just a guess at the
       shortest message — hud-top-right in particular grew taller once
       the menu button moved inside it (button + 3 text lines), and a
       longer toast like "LAUNCHED — IN ORBIT AROUND MERIDIAN" is wide
       enough to reach both corners at once when horizontally centered,
       so this needed real vertical clearance, not a horizontal dodge
       that would only work for short messages. */
    top: 120px; left: 50%;
    transform: translateX(-50%);
    max-width: 80%;
    text-align: center;
    font-size: 12px;
    padding: 6px 14px;
    border: 1px solid var(--green-dim);
    background: rgba(0,20,0,0.85);
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.visible { opacity: 1; }
</style>
</head>
<body>
<div id="bezel">
  <div id="screen">
    <canvas id="map"></canvas>

    <div class="hud-corner" id="hud-top-left">
      <div id="hud-location">SYSTEM: —</div>
      <div id="hud-refbody">TRACKING: —</div>
      <div id="hud-speed">V: 0.00 km/s</div>
      <div id="hud-orbit">AP: — PE: —</div>
      <div class="stat-row" style="margin-top: 6px;"><span class="stat-label">FUEL</span><div class="bar"><div class="bar-fill" id="bar-fuel"></div></div><span class="stat-readout" id="readout-fuel">—/—</span></div>
      <div class="stat-row"><span class="stat-label">OXYGEN</span><div class="bar"><div class="bar-fill" id="bar-oxygen"></div></div><span class="stat-readout" id="readout-oxygen">—/—</span></div>
      <div class="stat-row"><span class="stat-label">SUPPLY</span><div class="bar"><div class="bar-fill" id="bar-supplies"></div></div><span class="stat-readout" id="readout-supplies">—/—</span></div>
      <div class="stat-row"><span class="stat-label">HULL</span><div class="bar"><div class="bar-fill" id="bar-hull"></div></div><span class="stat-readout" id="readout-hull">—/—</span></div>
      <div id="hud-credits" style="margin-top: 6px; color: var(--green-bright);">CREDITS: —</div>
    </div>

    <div class="hud-corner" id="hud-top-right">
      <button class="btn small" id="menu-btn">≡ MENU</button>
      <div id="hud-clock">T+ 00:00:00</div>
      <div id="hud-warp">RUNNING</div>
      <div id="hud-build" style="color: var(--green-dim); font-size: 10px; margin-top: 4px;">BUILD 3</div>
    </div>

    <div id="left-controls">
      <button class="btn small" id="btn-pause">⏸ PAUSE</button>
      <button class="btn small" id="btn-follow-ship">◎ FOLLOW: ON</button>
      <div id="speed-controls">
        <button class="btn small" data-speed="0.1">0.1x</button>
        <button class="btn small" data-speed="1">1x</button>
        <button class="btn small" data-speed="5">5x</button>
        <button class="btn small" data-speed="10">10x</button>
        <button class="btn small" data-speed="100">100x</button>
      </div>
    </div>

    <div id="control-panel">
      <div class="panel-label">CONTROL PANEL</div>
      <div id="flight-controls">
        <button class="btn rotate" id="btn-rotate-left" title="Rotate Left">↺</button>
        <button class="btn rotate" id="btn-rotate-right" title="Rotate Right">↻</button>
        <button class="btn wide" id="btn-burn" title="Burn">▲ BURN</button>
        <button class="btn" id="btn-align-prograde" title="Align Prograde">PRO<br>GRADE</button>
        <button class="btn" id="btn-align-retrograde" title="Align Retrograde">RETRO<br>GRADE</button>
        <button class="btn wide" id="btn-land-launch" title="Land / Launch" disabled>LAND</button>
        <button class="btn wide" id="btn-market" title="Market" disabled>MARKET</button>
      </div>
    </div>

    <div id="toast"></div>

    <!-- Main menu overlay -->
    <div class="overlay" id="menu-overlay">
      <div class="panel">
        <h2>WANDERER CONSOLE</h2>
        <div class="row">
          <button class="btn" id="btn-pilot">🧑‍🚀 PILOT</button>
          <button class="btn" id="btn-codex">📖 CODEX</button>
          <button class="btn primary" id="btn-save">SAVE GAME</button>
          <button class="btn" id="btn-load">LOAD GAME</button>
          <button class="btn" id="btn-export">EXPORT SAVE FILE</button>
          <button class="btn" id="btn-import">IMPORT SAVE FILE</button>
          <button class="btn" id="btn-newgame">NEW GAME</button>
          <button class="btn" id="btn-reset">RESET SIMULATION</button>
          <input type="file" id="file-import" accept="application/json" style="display:none">
        </div>
        <div class="panel-close"><button class="btn" id="btn-close-menu">CLOSE</button></div>
      </div>
    </div>

    <!-- Codex: directory of every planet/moon's lore. List view and
         detail view share one panel and are toggled via JS rather than
         being two separate overlays, so "back" just swaps content
         in place rather than navigating between stacked overlays. -->
    <div class="overlay" id="codex-overlay">
      <div class="panel codex-panel">
        <h2 id="codex-title">CODEX</h2>
        <div id="codex-body"></div>
        <div class="panel-close"><button class="btn" id="btn-close-codex">CLOSE</button></div>
      </div>
    </div>

    <!-- Pilot readout: editable name + credits balance. -->
    <div class="overlay" id="pilot-overlay">
      <div class="panel">
        <h2>PILOT</h2>
        <div class="row">
          <div class="codex-field-label">NAME</div>
          <input type="text" id="pilot-name-input" maxlength="24" style="font-family:inherit;background:#001400;border:1px solid var(--green-dim);color:var(--green);padding:10px 8px;font-size:14px;width:100%;">
          <div class="codex-field-label" style="margin-top:10px;">CREDITS</div>
          <div id="pilot-credits" style="font-size:20px;color:var(--green-bright);letter-spacing:1px;">10,000</div>
        </div>
        <div class="panel-close"><button class="btn" id="btn-close-pilot">CLOSE</button></div>
      </div>
    </div>

    <!-- Market: only ever opened while landed — see updateLandLaunchControl
         / the MARKET control, which is disabled unless player.location
         is 'landed'. Prices come from Economy.priceAt, keyed by whatever
         body the ship is currently landed on. -->
    <div class="overlay" id="market-overlay">
      <div class="panel codex-panel">
        <h2 id="market-title">MARKET</h2>
        <div id="market-credits" style="margin-bottom:10px;font-size:13px;color:var(--green-bright);">CREDITS: 10,000</div>
        <div id="market-body"></div>
        <div class="panel-close"><button class="btn" id="btn-close-market">CLOSE</button></div>
      </div>
    </div>

    <!-- World-info auto-popup: shown automatically on arrival at a
         planet/moon (see checkWorldArrival in the script below), and
         also reachable by tapping an entry in the Codex. -->
    <div id="world-info-panel">
      <div id="world-info-header">
        <h3 id="world-info-title">—</h3>
        <button id="btn-close-world-info">✕</button>
      </div>
      <div id="world-info-body"></div>
    </div>

    <div class="scanline-overlay"></div>
  </div>
</div>

<script src="state.js"></script>
<script src="codex.js"></script>
<script src="economy.js"></script>
<script src="physics.js"></script>
<script src="save.js"></script>
<script src="starmap.js"></script>
<script src="input.js"></script>
<script>
/* =========================================================================
   MAIN.JS (inline) — Boots the game: loads or creates state, wires up
   the render/physics loop, HUD updates, and menu buttons.
   ========================================================================= */

let gameState = SaveSystem.load() || createNewGameState();

const canvas = document.getElementById('map');
StarMap.init(canvas);

// Give the camera a sane default on first-ever boot (fresh state has
// camera.zoom = 1 which is way too zoomed in for a whole system).
if (gameState.camera.zoom === 1 && gameState.meta.savedAt === null) {
  gameState.camera.zoom = 0.06;
  gameState.camera.x = 0;
  gameState.camera.y = 0;
}

Input.init(canvas, gameState, () => {}); // camera mutates gameState directly

// ---- Flight controls: rotate + burn are HELD (pressed/released), not
// single taps, since the ship now has continuous attitude control. We
// track raw press state here and read it once per frame in the main
// loop, rather than mutating physics directly from the event handlers —
// keeps all physics changes flowing through Physics.step() in one place.
const heldControls = { rotate: 0, thrust: false };

const btnRotateLeft = document.getElementById('btn-rotate-left');
const btnRotateRight = document.getElementById('btn-rotate-right');
const btnBurn = document.getElementById('btn-burn');

function bindHold(el, onStart, onEnd) {
  // touch-action: manipulation tells the browser this element handles its
  // own press/hold behavior and it shouldn't intercept the gesture for
  // its own purposes (long-press callouts, double-tap-to-zoom detection,
  // etc). Without this, iOS Safari can swallow the touch sequence
  // mid-gesture on a sustained press and never deliver a clean pointerup
  // to our own listener — which is exactly the "Burn gets stuck on"
  // symptom: the button's onStart fires, but its own onEnd never does,
  // because Safari decided the hold was the start of a different
  // gesture and stopped delivering pointer events for it.
  el.style.touchAction = 'manipulation';
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); onStart(); });
  el.addEventListener('pointerup', onEnd);
  el.addEventListener('pointercancel', onEnd);
  el.addEventListener('pointerleave', onEnd);
}

// Belt-and-suspenders: if a held control's release event is ever missed
// for any reason (a stray browser gesture swallowing it, a finger
// lifting off-screen, etc), a global pointerup/pointercancel anywhere in
// the document forces every held control off. This can never incorrectly
// cancel a burn that's still actually being held, since a genuine held
// touch keeps firing pointerdown/no pointerup on THAT element — it only
// ever catches the case where a release happened somewhere and our
// specific listener missed it.
function forceReleaseHeldControls() {
  if (heldControls.thrust) { heldControls.thrust = false; btnBurn.classList.remove('active'); }
  if (heldControls.rotate !== 0) {
    heldControls.rotate = 0;
    btnRotateLeft.classList.remove('active');
    btnRotateRight.classList.remove('active');
  }
}
document.addEventListener('pointerup', forceReleaseHeldControls);
document.addEventListener('pointercancel', forceReleaseHeldControls);

bindHold(btnRotateLeft,
  () => { heldControls.rotate = -1; btnRotateLeft.classList.add('active'); },
  () => { if (heldControls.rotate === -1) heldControls.rotate = 0; btnRotateLeft.classList.remove('active'); });

bindHold(btnRotateRight,
  () => { heldControls.rotate = 1; btnRotateRight.classList.add('active'); },
  () => { if (heldControls.rotate === 1) heldControls.rotate = 0; btnRotateRight.classList.remove('active'); });

bindHold(btnBurn,
  () => { heldControls.thrust = true; btnBurn.classList.add('active'); },
  () => { heldControls.thrust = false; btnBurn.classList.remove('active'); });

// ---- Align prograde/retrograde: these SET a target the ship steers
// toward every frame (see Physics.stepAttitude) rather than an instant
// snap, so the rotation is visible and any manual rotate input cancels
// it cleanly. Tapping the already-active one turns it off.
const btnAlignPro = document.getElementById('btn-align-prograde');
const btnAlignRetro = document.getElementById('btn-align-retrograde');

function setAlignTarget(target) {
  const ship = gameState.player.ship;
  ship.alignTarget = (ship.alignTarget === target) ? null : target;
  btnAlignPro.classList.toggle('active', ship.alignTarget === 'prograde');
  btnAlignRetro.classList.toggle('active', ship.alignTarget === 'retrograde');
}
btnAlignPro.addEventListener('click', () => setAlignTarget('prograde'));
btnAlignRetro.addEventListener('click', () => setAlignTarget('retrograde'));

// ---- Land / Launch ----
// One button that does either job depending on current state: LAND when
// flying close enough to a planet/moon/station ("low orbit" — see
// Physics.landingRangeFor), LAUNCH when already landed. Checked every
// frame (see updateLandLaunchControl, called from the main loop) since
// "close enough to land" is a continuous flight condition, not something
// only known at the moment of a button press.
//
// For now landing/launching is a placeholder: a notification and an
// instant state flip, with no landing sequence or surface activities —
// those come later. Launch always places the ship in a fresh low orbit
// (or, for a massless station, a simple short-range undock) using the
// exact same math as the game's initial spawn, so it's just as stable.
const btnLandLaunch = document.getElementById('btn-land-launch');

function setFlightControlsEnabled(enabled) {
  [btnRotateLeft, btnRotateRight, btnBurn, btnAlignPro, btnAlignRetro].forEach(btn => {
    btn.disabled = !enabled;
  });
  if (!enabled) {
    heldControls.rotate = 0;
    heldControls.thrust = false;
    btnRotateLeft.classList.remove('active');
    btnRotateRight.classList.remove('active');
    btnBurn.classList.remove('active');
  }
}

function updateLandLaunchControl() {
  const system = getCurrentSystem(gameState);
  if (gameState.player.location === 'landed') {
    btnLandLaunch.disabled = false;
    btnLandLaunch.textContent = 'LAUNCH';
    btnLandLaunch.classList.add('landed');
    btnLandLaunch.dataset.landableId = '';
  } else {
    const landable = Physics.findLandableBody(system, gameState.player.ship);
    btnLandLaunch.classList.remove('landed');
    if (landable) {
      btnLandLaunch.disabled = false;
      btnLandLaunch.textContent = `LAND: ${landable.name.toUpperCase()}`;
      btnLandLaunch.dataset.landableId = landable.id;
    } else {
      btnLandLaunch.disabled = true;
      btnLandLaunch.textContent = 'LAND';
      btnLandLaunch.dataset.landableId = '';
    }
  }
  // Market is only ever reachable while actually landed — there's no
  // "remote ordering" concept, you have to be docked/grounded somewhere
  // to restock from it.
  document.getElementById('btn-market').disabled = gameState.player.location !== 'landed';
}

btnLandLaunch.addEventListener('click', () => {
  const system = getCurrentSystem(gameState);
  if (gameState.player.location === 'landed') {
    const body = Physics.findBody(system, gameState.player.landedBodyId);
    const name = body ? body.name.toUpperCase() : 'ORBIT';
    Physics.launch(gameState);
    setFlightControlsEnabled(true);
    showToast(`LAUNCHED — IN ORBIT AROUND ${name}`);
  } else {
    const landableId = btnLandLaunch.dataset.landableId;
    const body = landableId ? Physics.findBody(system, landableId) : null;
    if (!body) return; // button should be disabled in this case, but don't act on stale data
    Physics.land(gameState, body);
    setFlightControlsEnabled(false);
    showToast(`LANDED AT ${body.name.toUpperCase()}`);
  }
  updateLandLaunchControl();
});

// ---- Pause ----
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  gameState.time.paused = !gameState.time.paused;
  btnPause.textContent = gameState.time.paused ? '▶ RESUME' : '⏸ PAUSE';
});

// ---- Speed (0.1x/1x/5x/10x/100x) ----
// A capped range rather than the old wide warp scale: attitude flying
// (rotate/burn/align) needs to stay controllable. 0.1x gives fine
// control for a tricky final approach or docking-style maneuver; 100x
// is fast enough to skip through a long interplanetary coast.
const speedButtons = document.querySelectorAll('[data-speed]');
function setSpeedButtonsActive(scale) {
  speedButtons.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.speed) === scale));
}
speedButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    gameState.time.timeScale = Number(btn.dataset.speed);
    setSpeedButtonsActive(gameState.time.timeScale);
  });
});
setSpeedButtonsActive(gameState.time.timeScale);

// ---- Follow-ship camera toggle ----
const btnFollow = document.getElementById('btn-follow-ship');
btnFollow.addEventListener('click', () => {
  const on = !gameState.camera.followShip;
  Input.setFollowShip(on);
  btnFollow.textContent = on ? '◎ FOLLOW: ON' : '◎ FOLLOW: OFF';
});


// ---- Menu wiring ----
const menuOverlay = document.getElementById('menu-overlay');
document.getElementById('menu-btn').onclick = () => menuOverlay.classList.add('visible');
document.getElementById('btn-close-menu').onclick = () => menuOverlay.classList.remove('visible');

// ---- Codex (directory) + world-info auto-popup ----
// Both share one rendering function (renderCodexEntryHtml) so the Codex
// directory's detail view and the on-arrival popup always show exactly
// the same content — there's only one "truth" for what a world's lore
// looks like, just two different places it can be read.
function renderCodexEntryHtml(body, entry, opts) {
  opts = opts || {};
  if (!entry) return '<div class="codex-field-body"><em>No data available.</em></div>';
  const field = (label, html) => `<div class="codex-field"><div class="codex-field-label">${label}</div><div class="codex-field-body">${html}</div></div>`;
  const list = items => (items && items.length) ? ('<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>') : '<em>None known.</em>';
  let html = '';
  if (opts.showName !== false) html += `<h3>${body.name.toUpperCase()}</h3>`;
  html += `<div class="codex-type">${entry.type}</div>`;
  html += field('Terrain', entry.terrain);
  html += field('Habitability', entry.habitability);
  html += field('Population', entry.population);
  html += field('Government', entry.government);
  html += field('History', entry.history);
  html += field('Current News', list(entry.news));
  html += field('Legal Trade', list(entry.commoditiesLegal));
  html += field('Illegal Trade', list(entry.commoditiesIllegal));
  if (entry.personalities && entry.personalities.length) {
    html += field('Notable Personalities', entry.personalities.map(p =>
      `<div class="codex-personality"><span class="name">${p.name}</span> — <span class="role">${p.role}</span><br>${p.blurb}</div>`
    ).join(''));
  }
  return html;
}

function renderCodexList() {
  const system = getCurrentSystem(gameState);
  let html = '';
  Codex.listByPlanet(system).forEach(g => {
    html += '<div class="codex-group">';
    html += `<button class="codex-entry-btn" data-body-id="${g.body.id}">${g.body.name.toUpperCase()}</button>`;
    g.moons.forEach(m => {
      html += `<button class="codex-entry-btn moon" data-body-id="${m.id}">${m.name}</button>`;
    });
    html += '</div>';
  });
  return html;
}

let codexView = { mode: 'list', bodyId: null };
function renderCodexBody() {
  const codexBody = document.getElementById('codex-body');
  if (codexView.mode === 'detail' && codexView.bodyId) {
    const system = getCurrentSystem(gameState);
    const body = Physics.findBody(system, codexView.bodyId);
    const entry = Codex.getEntry(codexView.bodyId);
    codexBody.innerHTML = '<button class="btn small" id="btn-codex-back" style="margin-bottom:10px;">← DIRECTORY</button>'
      + '<div class="codex-detail">' + renderCodexEntryHtml(body, entry) + '</div>';
  } else {
    codexBody.innerHTML = renderCodexList();
  }
}
// Event delegation on the container rather than re-binding handlers after
// every innerHTML replacement (simpler and can't silently stop working if
// a future render forgets to re-bind).
document.getElementById('codex-body').addEventListener('click', e => {
  const entryBtn = e.target.closest('.codex-entry-btn');
  if (entryBtn) {
    codexView = { mode: 'detail', bodyId: entryBtn.dataset.bodyId };
    renderCodexBody();
    return;
  }
  if (e.target.id === 'btn-codex-back') {
    codexView = { mode: 'list', bodyId: null };
    renderCodexBody();
  }
});
document.getElementById('btn-codex').addEventListener('click', () => {
  codexView = { mode: 'list', bodyId: null };
  renderCodexBody();
  menuOverlay.classList.remove('visible');
  document.getElementById('codex-overlay').classList.add('visible');
});
document.getElementById('btn-close-codex').addEventListener('click', () => {
  document.getElementById('codex-overlay').classList.remove('visible');
});

// World-info auto-popup: shown when the ship's dominant body (see
// Physics.dominantBody) changes to a MORE SPECIFIC body than before —
// i.e. arriving at a planet/moon, the same "depth increased" signal
// Physics.applySoftCapture uses internally for its own, unrelated
// purpose (deciding when to soft-capture). Kept as fully separate,
// UI-only state here rather than reusing ship.lastDominantBodyId
// directly, so this notification concern never gets entangled with that
// physics-internal bookkeeping.
const worldInfoPanel = document.getElementById('world-info-panel');
function openWorldInfo(bodyId) {
  const system = getCurrentSystem(gameState);
  const body = Physics.findBody(system, bodyId);
  const entry = Codex.getEntry(bodyId);
  if (!body || !entry) return;
  document.getElementById('world-info-title').textContent = body.name.toUpperCase();
  document.getElementById('world-info-body').innerHTML = renderCodexEntryHtml(body, entry, { showName: false });
  worldInfoPanel.classList.add('visible');
}
document.getElementById('btn-close-world-info').addEventListener('click', () => {
  worldInfoPanel.classList.remove('visible');
});

// Initialized from the actual starting ship state (not null) so the very
// first frame after a fresh page load doesn't mistake "ship already
// orbiting Aldrin at game start" for a brand-new arrival — the same class
// of fix already applied to ship.lastDominantBodyId itself in state.js.
// Also re-synced in syncControlButtonsToState for every later load/reset.
let shownWorldPopupFor = gameState.player.ship.lastDominantBodyId;
function checkWorldArrival() {
  if (gameState.player.location === 'landed') return; // already settled; nothing new to announce
  const system = getCurrentSystem(gameState);
  const ship = gameState.player.ship;
  const positions = Physics.allWorldPositions(system);
  const dom = Physics.dominantBody(system, ship.x, ship.y, positions);
  if (!dom || dom.id === shownWorldPopupFor) return;
  const prevBody = Physics.findBody(system, shownWorldPopupFor);
  const prevDepth = prevBody ? Physics.bodyDepth(system, prevBody) : 0;
  const newDepth = Physics.bodyDepth(system, dom);
  const arrived = newDepth > prevDepth; // deeper SOI = arrival; shallower = departure, no popup
  shownWorldPopupFor = dom.id;
  if (arrived && (dom.kind === BodyKind.PLANET || dom.kind === BodyKind.MOON) && Codex.hasEntry(dom.id)) {
    openWorldInfo(dom.id);
  }
}

function formatCredits(n) {
  return Math.round(n).toLocaleString('en-US');
}

// ---- Pilot readout ----
const pilotOverlay = document.getElementById('pilot-overlay');
const pilotNameInput = document.getElementById('pilot-name-input');
document.getElementById('btn-pilot').addEventListener('click', () => {
  pilotNameInput.value = gameState.player.pilotName;
  document.getElementById('pilot-credits').textContent = formatCredits(gameState.player.credits);
  menuOverlay.classList.remove('visible');
  pilotOverlay.classList.add('visible');
});
pilotNameInput.addEventListener('input', e => {
  gameState.player.pilotName = e.target.value;
});
document.getElementById('btn-close-pilot').addEventListener('click', () => {
  // An emptied-out field falls back to a sane default rather than
  // leaving the pilot permanently nameless.
  if (!gameState.player.pilotName.trim()) gameState.player.pilotName = 'Unnamed Pilot';
  pilotOverlay.classList.remove('visible');
});

// ---- Market (restock consumables while landed) ----
const RESOURCE_LABELS = { fuel: 'FUEL', oxygen: 'OXYGEN', supplies: 'SUPPLIES' };
function renderMarket() {
  const system = getCurrentSystem(gameState);
  const bodyId = gameState.player.landedBodyId;
  const body = Physics.findBody(system, bodyId);
  const ship = gameState.player.ship;

  document.getElementById('market-title').textContent = body ? `MARKET — ${body.name.toUpperCase()}` : 'MARKET';
  document.getElementById('market-credits').textContent = `CREDITS: ${formatCredits(gameState.player.credits)}`;

  let html = '';
  ['fuel', 'oxygen', 'supplies'].forEach(key => {
    const current = ship[key];
    const max = ship[key + 'Max'];
    const price = Economy.priceAt(bodyId, key);
    const needed = Math.max(0, max - current);
    const fullCost = needed * price;
    const affordableUnits = price > 0 ? gameState.player.credits / price : needed;
    const canAffordFull = affordableUnits >= needed;
    html += `<div class="codex-field">
      <div class="codex-field-label">${RESOURCE_LABELS[key]} — ${Math.round(current)}/${Math.round(max)} — ${price.toFixed(2)} CR/UNIT</div>
      <div class="codex-field-body">
        <button class="btn small" data-buy="${key}" ${needed <= 0 ? 'disabled' : ''}>
          ${needed <= 0 ? 'FULL' : (canAffordFull ? `FILL (${fullCost.toFixed(0)} CR)` : 'FILL (PARTIAL — LOW CREDITS)')}
        </button>
      </div>
    </div>`;
  });
  document.getElementById('market-body').innerHTML = html;
}

function buyResource(key) {
  const ship = gameState.player.ship;
  const bodyId = gameState.player.landedBodyId;
  const price = Economy.priceAt(bodyId, key);
  if (price === null || price <= 0) return;
  const needed = ship[key + 'Max'] - ship[key];
  if (needed <= 0) return;
  const affordableUnits = gameState.player.credits / price;
  const unitsToBuy = Math.min(needed, affordableUnits);
  if (unitsToBuy <= 0) return;
  const cost = unitsToBuy * price;
  ship[key] = Math.min(ship[key + 'Max'], ship[key] + unitsToBuy);
  gameState.player.credits = Math.max(0, gameState.player.credits - cost);
  renderMarket();
  updateHud();
}
document.getElementById('market-body').addEventListener('click', e => {
  const btn = e.target.closest('[data-buy]');
  if (btn) buyResource(btn.dataset.buy);
});
document.getElementById('btn-market').addEventListener('click', () => {
  if (gameState.player.location !== 'landed') return; // button should already be disabled in this case
  renderMarket();
  document.getElementById('market-overlay').classList.add('visible');
});
document.getElementById('btn-close-market').addEventListener('click', () => {
  document.getElementById('market-overlay').classList.remove('visible');
});

// Whenever gameState is replaced wholesale (load/new game/import), the
// control buttons need to resync their visual state to match — otherwise
// e.g. the pause button could still say "RESUME" after loading a save
// that wasn't paused, which would be a confusing, silently-wrong label.
function syncControlButtonsToState() {
  btnPause.textContent = gameState.time.paused ? '▶ RESUME' : '⏸ PAUSE';
  btnFollow.textContent = gameState.camera.followShip ? '◎ FOLLOW: ON' : '◎ FOLLOW: OFF';
  btnAlignPro.classList.toggle('active', gameState.player.ship.alignTarget === 'prograde');
  btnAlignRetro.classList.toggle('active', gameState.player.ship.alignTarget === 'retrograde');
  setSpeedButtonsActive(gameState.time.timeScale);
  heldControls.rotate = 0;
  heldControls.thrust = false;
  btnRotateLeft.classList.remove('active');
  btnRotateRight.classList.remove('active');
  btnBurn.classList.remove('active');
  setFlightControlsEnabled(gameState.player.location !== 'landed');
  updateLandLaunchControl();
  // Re-sync to wherever the (newly loaded/reset) ship actually is, so a
  // load/new-game/reset never spuriously re-shows the arrival popup for
  // a world the player was already at before this reset happened.
  shownWorldPopupFor = gameState.player.ship.lastDominantBodyId;
  worldInfoPanel.classList.remove('visible');
}

document.getElementById('btn-save').onclick = () => {
  const res = SaveSystem.save(gameState);
  showToast(res.ok ? 'GAME SAVED' : 'SAVE FAILED');
};
document.getElementById('btn-load').onclick = () => {
  const loaded = SaveSystem.load();
  if (loaded) {
    gameState = loaded;
    Input.init(canvas, gameState, () => {}); // re-bind to new state object
    syncControlButtonsToState();
    showToast('GAME LOADED');
    menuOverlay.classList.remove('visible');
  } else {
    showToast('NO SAVE FOUND');
  }
};
// Shared by both "New Game" and "Reset Simulation" — right now these are
// functionally identical (there's no persistent player progression yet
// to distinguish "start fresh" from "put the current run back at its
// starting point"), but kept as separate menu entries and a named
// function since that will likely change once trading/engineering/
// discovery add real progression a player wouldn't want reset.
function resetToStart(confirmMessage, toastMessage) {
  if (confirm(confirmMessage)) {
    gameState = createNewGameState();
    gameState.camera.zoom = 0.06;
    Input.init(canvas, gameState, () => {});
    syncControlButtonsToState();
    showToast(toastMessage);
    menuOverlay.classList.remove('visible');
  }
}
document.getElementById('btn-newgame').onclick = () => {
  resetToStart('Start a new game? Unsaved progress will be lost.', 'NEW GAME STARTED');
};
document.getElementById('btn-reset').onclick = () => {
  resetToStart('Reset the simulation back to its starting state? Unsaved progress will be lost.', 'SIMULATION RESET');
};
document.getElementById('btn-export').onclick = () => SaveSystem.exportToFile(gameState);
document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
document.getElementById('file-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  SaveSystem.importFromFile(file, (loaded, err) => {
    if (err) { showToast('IMPORT FAILED'); return; }
    gameState = loaded;
    Input.init(canvas, gameState, () => {});
    syncControlButtonsToState();
    showToast('SAVE IMPORTED');
    menuOverlay.classList.remove('visible');
  });
});

// ---- Toast ----
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), 1500);
}

// ---- HUD update ----
function fmtClock(simSeconds) {
  const s = Math.floor(simSeconds);
  const hh = Math.floor(s / 3600).toString().padStart(2, '0');
  const mm = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
  const ss = Math.floor(s % 60).toString().padStart(2, '0');
  return `T+ ${hh}:${mm}:${ss}`;
}

function setBar(id, pct) {
  const el = document.getElementById(id);
  el.style.width = `${Math.max(0, Math.min(100, pct))}%`;
  el.classList.remove('warn', 'crit');
  if (pct < 15) el.classList.add('crit');
  else if (pct < 40) el.classList.add('warn');
}

function updateHud() {
  const ship = gameState.player.ship;
  const system = getCurrentSystem(gameState);

  document.getElementById('hud-location').textContent = `SYSTEM: ${system.name.toUpperCase()}`;

  const near = Physics.nearestBody(system, ship);
  document.getElementById('hud-refbody').textContent = `TRACKING: ${near ? near.name.toUpperCase() : '—'}`;

  const speed = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
  document.getElementById('hud-speed').textContent = `V: ${speed.toFixed(2)} km/s`;

  const orbitEl = document.getElementById('hud-orbit');
  if (gameState.player.location === 'landed') {
    const landedBody = Physics.findBody(system, gameState.player.landedBodyId);
    orbitEl.textContent = `LANDED: ${landedBody ? landedBody.name.toUpperCase() : '—'}`;
  } else {
    const els = Physics.orbitalElements(system, ship);
    if (els && els.closed) {
      orbitEl.textContent = `AP: ${els.rApo.toFixed(1)} PE: ${els.rPeri.toFixed(1)}`;
    } else {
      orbitEl.textContent = 'AP: ESCAPE PE: —';
    }
  }

  document.getElementById('hud-clock').textContent = fmtClock(gameState.time.simSeconds);
  document.getElementById('hud-warp').textContent = gameState.time.paused ? 'PAUSED' : 'RUNNING';

  setBar('bar-fuel', (ship.fuel / ship.fuelMax) * 100);
  setBar('bar-oxygen', (ship.oxygen / ship.oxygenMax) * 100);
  setBar('bar-supplies', (ship.supplies / ship.suppliesMax) * 100);
  setBar('bar-hull', (ship.hull / ship.hullMax) * 100);

  setReadout('readout-fuel', ship.fuel, ship.fuelMax);
  setReadout('readout-oxygen', ship.oxygen, ship.oxygenMax);
  setReadout('readout-supplies', ship.supplies, ship.suppliesMax);
  setReadout('readout-hull', ship.hull, ship.hullMax);

  document.getElementById('hud-credits').textContent = `CREDITS: ${formatCredits(gameState.player.credits)}`;
}

function setReadout(id, current, max) {
  document.getElementById(id).textContent = `${Math.round(current)}/${Math.round(max)}`;
}

// ---- Main loop ----
let lastTime = performance.now();
function loop(now) {
  const realDt = Math.min(0.1, (now - lastTime) / 1000); // clamp for tab-switch stalls
  lastTime = now;

  Physics.step(gameState, realDt, heldControls);
  StarMap.draw(gameState);
  updateHud();
  updateLandLaunchControl();
  checkWorldArrival();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- Autosave on page hide (covers iPad Safari backgrounding/closing) ----
document.addEventListener('visibilitychange', () => {
  if (document.hidden) SaveSystem.save(gameState);
});
window.addEventListener('pagehide', () => SaveSystem.save(gameState));
</script>
